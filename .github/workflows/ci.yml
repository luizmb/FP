name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Cache Mint packages
        uses: actions/cache@v5
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}
          restore-keys: ${{ runner.os }}-mint-

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-homebrew-

      - name: Install Mint
        run: brew install mint

      - name: Install SwiftLint, SwiftFormat, and Periphery
        run: mint bootstrap

      - name: Format (check)
        # --lint exits with code 1 if any file would be changed — no post-check needed
        run: mint run swiftformat --lint .

      - name: Lint
        run: mint run swiftlint lint --strict

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test 2>&1

      - name: Periphery
        run: mint run periphery scan

  test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test 2>&1

  test-android:
    name: Build & Test (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cross-compiles with the Swift Android SDK and runs the suite on an emulator the action
      # provisions. The action caches the downloaded SDK/toolchain internally, so only the first
      # run pays the full download. Tests run in parallel: the action invokes the on-device binary
      # as both XCTest and swift-testing, and the XCTest pass rejects swift test's --no-parallel,
      # so serial execution can't be forced here (FP's tests are parallel-safe regardless).
      - name: Test Swift Package on Android
        uses: skiptools/swift-android-action@v2
        with:
          free-disk-space: true

  test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      # Installs the Swift toolchain for Windows (uses the Visual Studio C++ tools preinstalled on
      # the runner). Toolchain setup must come before checkout/build.
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE

      - uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # Non-gating: builds and runs the nested BenchmarkSuite package (which pulls in
  # package-benchmark + jemalloc — deliberately kept out of the shipping package).
  # `continue-on-error` ensures it never blocks a PR. It exists to surface the
  # three-way by-id comparison — plain [ID: Element] Dictionary vs [Element] Array
  # vs IdentifiedArray — on a stable runner; results are written to the job summary.
  benchmarks:
    name: Benchmarks (non-gating)
    runs-on: macos-26
    continue-on-error: true
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install jemalloc
        run: brew install jemalloc

      - name: Run benchmarks (Dictionary vs Array vs IdentifiedArray)
        working-directory: BenchmarkSuite
        run: |
          {
            echo '## IdentifiedArray benchmarks'
            echo
            echo 'Three-way by-id comparison on a stable runner. Lower time / higher throughput is better.'
            echo
            echo '```'
            swift package --disable-sandbox benchmark --no-progress 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
