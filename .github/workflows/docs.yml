name: Documentation

on:
  push:
    tags: ['v*']
  # Manual clean re-deploy (single artifact) without a new tag — for transient Pages
  # \"Deployment failed, try again later\". Never use `gh run rerun --failed` on a docs run.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: Deploy Documentation
    runs-on: macos-26
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Generate Documentation
        run: |
          swift package \
            --allow-writing-to-directory .docs \
            generate-documentation \
            --target FP \
            --target CoreFP \
            --target CoreFPOperators \
            --target DataStructure \
            --target DataStructureOperators \
            --enable-experimental-combined-documentation \
            --output-path .docs \
            --transform-for-static-hosting \
            --hosting-base-path FP

      - name: Redirect site root to the FP module's landing page
        run: |
          # /documentation/ (no module) is an empty shell in combined-documentation mode —
          # each of the 5 targets gets its own /documentation/<module>/ page, and only
          # /documentation/fp/ has a real Overview + Topics tree (it's this catalog's only
          # curated landing page). Redirect there directly, not to the bare index.
          cat > .docs/index.html <<'EOF'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=./documentation/fp/">
          <link rel="canonical" href="./documentation/fp/">
          <title>FP — Documentation</title>
          <a href="./documentation/fp/">Redirecting to documentation…</a>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .docs

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
